apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vault-auto-unseal.fullname" . }}-test-health"
  labels:
    {{- include "vault-auto-unseal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "Testing health endpoint..."
          wget -q -O- --timeout=5 http://{{ include "vault-auto-unseal.fullname" . }}:{{ .Values.service.port }}/health
          if [ $? -eq 0 ]; then
            echo ""
            echo "Health check PASSED"
            exit 0
          else
            echo "Health check FAILED"
            exit 1
          fi
