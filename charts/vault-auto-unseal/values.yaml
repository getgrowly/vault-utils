# -- Number of controller replicas
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/getgrowly/vault-utils
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the release name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# Auto-unseal controller configuration
controller:
  # -- Kubernetes namespace where Vault pods are running
  vaultNamespace: vault
  # -- Port number where Vault is listening
  vaultPort: "8200"
  # -- Interval in seconds between Vault status checks
  checkInterval: 10

serviceAccount:
  # -- Whether to create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- The name of the ServiceAccount (generated if not set)
  name: ""

rbac:
  # -- Whether to create Role and RoleBinding for secret management
  create: true

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

# -- Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Health check service port
  port: 8080

# -- Resource requests and limits
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Liveness probe configuration
livenessProbe:
  httpGet:
    # -- Liveness probe endpoint path
    path: /health
    # -- Liveness probe port
    port: http
  # -- Initial delay before liveness probe starts
  initialDelaySeconds: 5
  # -- Interval between liveness probes
  periodSeconds: 10

# Readiness probe configuration
readinessProbe:
  httpGet:
    # -- Readiness probe endpoint path
    path: /ready
    # -- Readiness probe port
    port: http
  # -- Initial delay before readiness probe starts
  initialDelaySeconds: 5
  # -- Interval between readiness probes
  periodSeconds: 10

# -- Node selector constraints
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# ------------------------------------------------------------------------------
# HashiCorp Vault Sub-chart Configuration
# See: https://developer.hashicorp.com/vault/docs/platform/k8s/helm/configuration
# ------------------------------------------------------------------------------
vault:
  # -- Enable deploying HashiCorp Vault as a dependency
  enabled: true

  server:
    # -- Number of Vault server replicas
    replicas: 1

    # -- Image settings for Vault server
    image:
      repository: hashicorp/vault
      tag: "1.15.4"

    # -- Resource requests and limits for Vault server
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 256Mi
        cpu: 250m

    # -- Extra labels for Vault server pods (required for auto-unseal discovery)
    extraLabels:
      component: server

    # -- Readiness probe for Vault
    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"

    # -- Liveness probe for Vault
    livenessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
      initialDelaySeconds: 60

    # -- Data storage configuration
    dataStorage:
      enabled: true
      size: 10Gi

    # -- Standalone mode configuration (default)
    standalone:
      enabled: true
      config: |
        ui = false
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }

    # -- HA mode configuration (disabled by default)
    ha:
      enabled: false
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }
          service_registration "kubernetes" {}

  # -- Vault UI settings
  ui:
    enabled: false

  # -- Injector settings (disable if not needed)
  injector:
    enabled: false
