apiVersion: v2
name: vault-auto-unseal
description: A Kubernetes controller that automatically initializes and unseals HashiCorp Vault instances
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - vault
  - hashicorp
  - auto-unseal
  - kubernetes
  - controller
home: https://github.com/getgrowly/vault-utils
sources:
  - https://github.com/getgrowly/vault-utils
maintainers:
  - name: getgrowly
    url: https://github.com/getgrowly
icon: https://raw.githubusercontent.com/hashicorp/vault/main/ui/public/vault-logo.svg
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: GitHub
      url: https://github.com/getgrowly/vault-utils
    - name: Container Image
      url: https://ghcr.io/getgrowly/vault-utils
dependencies:
  - name: vault
    version: "0.28.1"
    repository: "https://helm.releases.hashicorp.com"
    condition: vault.enabled
